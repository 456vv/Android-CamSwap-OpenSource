name: Build CamSwap APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'                    # v2.7、v2.8.1 等版本标签
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write               # 用于创建 Release 和上传资产

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository + submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install specific NDK & CMake
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ====================== Build ======================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      # ====================== Sign ======================
      - name: Sign Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

          # 查找 unsigned APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*unsigned*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "❌ Unsigned APK not found!"
            exit 1
          fi

          SIGNED_APK="${UNSIGNED_APK/unsigned/signed}"
          BUILD_TOOLS=$($ANDROID_HOME/build-tools/*/apksigner --version 2>&1 | head -n1 | awk '{print $NF}' | cut -d/ -f1)

          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          echo "SIGNED_APK=$SIGNED_APK" >> $GITHUB_ENV
          echo "✅ Release APK signed successfully: $SIGNED_APK"
          rm -f release.jks

      # ====================== Upload Artifacts ======================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CamSwap-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: CamSwap-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ====================== Create GitHub Release ======================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*-signed.apk
            app/build/outputs/apk/release/*-unsigned.apk
            app/build/outputs/apk/debug/*.apk
          name: CamSwap ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
